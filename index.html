<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Sarabun,system-ui,sans-serif}
header{background:var(--pri);color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700}

nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}

button.sec{background:var(--pri2);color:var(--pri)}button.warn{background:var(--warn2);color:var(--warn)}button.bad{background:var(--bad2);color:var(--bad)}

tr.click{cursor:pointer}tr.click:hover{background:var(--pri2)}

.th{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}

<script>
/* ============ พื้นฐาน / ฐานข้อมูล (IndexedDB ในเบราว์เซอร์ — ต้นแบบ) ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const pad=(n,l)=>String(n).padStart(l,'0');
const fmtT=t=>t?new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'';
const fmtD=d=>d?new Date(d).toLocaleDateString('th-TH',{dateStyle:'medium'}):'';
const yy=()=>String(new Date().getFullYear()+543).slice(-2);

const idb={open(){return new Promise((res,rej)=>{const r=indexedDB.open('patholis',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const d=await this.open();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})},
  async set(k,v){const d=await this.open();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})}};
const DOCTORS=[['3601200037692','นายอภิชาติ ชุมทอง'],['3659900294008','นางสาวปฏิมา บุญโญ'],['3190200325586','นายอรรณพ นาคะปัท'],['3710900612710','นายยิ่งยศ จุลกิจวัฒน์'],['1659900195003','นางสาวจินตนา วังสถิตธรรม'],['1640600163531','นายมานะ เมืองเอี่ยม'],['1559900047790','นางสาวชญาณิศวร์ มงคลวิสุทธิ์']].map(([id,name])=>({id,name}));
const DEMO_PASSWORD='1234'; // ต้นแบบเท่านั้น — ระบบจริงต้องตรวจรหัสผ่านที่ server และเก็บแบบ hash
let db={seq:{},lab:{},cases:[],user:'',session:null,settings:{doctors:DOCTORS,hisPullUrl:'',hisResultUrl:'',aiEndpoint:''}};
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>idb.set('db',db).catch(()=>{}),150)};

const STATUS={draft:'รอลงทะเบียน',registered:'รับเคสแล้ว',grossed:'ตัดชิ้นเนื้อแล้ว',processing:'กำลังประมวลผล',ready:'พร้อมอ่าน',reading:'แพทย์กำลังอ่าน',signed:'อนุมัติผลแล้ว',sent:'ส่งเข้า HIS แล้ว'};
const STEPS=[['grossing','ตัดชิ้นเนื้อ (Grossing)'],['fixation','ดองน้ำยา (Fixation)'],['processing','Tissue processing'],['embedding','หล่อบล็อกพาราฟิน'],['cutting','ตัดสไลด์'],['staining','ย้อม H&E'],['coverslip','ปิดกระจก'],['qc','QC & ส่งแพทย์']];
const stepName=k=>(STEPS.find(s=>s[0]===k)||[0,k])[1];
const RTYPES=['Patho ทั่วไป','Screening colonoscope','PAP smear','Appendix','Cone / LEEP','อื่นๆ'];
const PROCS=['Needle biopsy','Punch biopsy','Incision','Excision','Cone / LEEP','Necropsy','Other'];
const STAINS=['IHC (Immunohistochemistry)','Wright','Oppitz','AFB','Modified AFB','PAS','GMS','Masson trichrome','Congo red','อื่นๆ'];
const COLORS=['ฟ้า','ขาว','ชมพู','เหลือง','เขียว','ส้ม'];
const DEMO_HIS=[
 {hn:'6812345',fname:'สมชาย',lname:'ใจดี',dob:'1962-03-14',sex:'ช',ward:'อายุรกรรมชาย 1',doctor:'นพ.ประเสริฐ ศัลยกร',history:'ถ่ายเป็นเลือดสด 2 เดือน น้ำหนักลด 5 กก.',exam:'ซีดเล็กน้อย, PR: mass 5 cm from anal verge',radiology:'CT abdomen: wall thickening rectosigmoid',provisional:'Rectal cancer'},
 {hn:'6923456',fname:'สมหญิง',lname:'รักดี',dob:'1988-07-21',sex:'ญ',ward:'OPD สูติ-นรีเวช',doctor:'พญ.มาลี นรีเวช',history:'มาตรวจคัดกรองมะเร็งปากมดลูก',exam:'ปากมดลูกเรียบ ไม่มีแผล',radiology:'',provisional:'Screening'},
 {hn:'7034567',fname:'วิชัย',lname:'มั่นคง',dob:'1995-11-02',sex:'ช',ward:'ศัลยกรรมชาย',doctor:'นพ.สุรชัย ศัลยกร',history:'ปวดท้องด้านขวาล่าง 1 วัน ไข้ต่ำ',exam:'RLQ tenderness, rebound +',radiology:'US: non-compressible tubular structure',provisional:'Acute appendicitis'}];

/* ============ รูปภาพ / AI ============ */
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function compress(file,max=1280){const i=await loadImg(URL.createObjectURL(file));const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.75)}
function pickFiles(multi=true){return new Promise(res=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=multi;f.onchange=async()=>res(await Promise.all([...f.files].map(x=>compress(x))));f.click()})}
async function decodeQR(src){ // BarcodeDetector ถ้ามี ไม่งั้นใช้ jsQR (ทำงานได้ทุกเบราว์เซอร์)
  const im=await loadImg(src);
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:['qr_code']}).detect(im);if(r[0])return r[0].rawValue}}catch{}
  if(!window.jsQR)return '';
  for(const k of [1,.6,.35]){const w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
    const q=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(q&&q.data)return q.data}
  return '';
}
/* สแกน QR สดจากกล้อง (ต้องเปิดผ่าน https หรือ localhost) แล้วเก็บเฟรมตอนอ่านได้เป็นรูปงาน */
const Cam={stream:null,timer:0,el:null,
  async open(onHit){
    if(!navigator.mediaDevices?.getUserMedia)return alert('เบราว์เซอร์/การเชื่อมต่อนี้ใช้กล้องไม่ได้ (ต้องใช้ https หรือ localhost) — ใช้ปุ่มถ่ายรูปแทน');
    try{this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false})}catch(e){return alert('เปิดกล้องไม่ได้: '+e.message)}
    const o=this.el=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px';
    o.innerHTML='<video playsinline muted style="max-width:96vw;max-height:78vh;border-radius:12px"></video><div style="color:#fff">เล็งกล้องไปที่ QR บนสติกเกอร์ — เมื่ออ่านได้ระบบจะเก็บภาพให้อัตโนมัติ</div><button class="bad">ปิดกล้อง</button>';
    document.body.appendChild(o);const v=$('video',o);v.srcObject=this.stream;await v.play();$('button',o).onclick=()=>this.close();
    const det='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{if(!this.el)return;try{
      if(v.videoWidth){const k=Math.min(1,640/v.videoWidth);cv.width=v.videoWidth*k;cv.height=v.videoHeight*k;cx.drawImage(v,0,0,cv.width,cv.height);
        let txt='';if(det){const r=await det.detect(cv);txt=r[0]?.rawValue||''}
        if(!txt&&window.jsQR){const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});txt=q?.data||''}
        if(txt){const f=document.createElement('canvas');f.width=v.videoWidth;f.height=v.videoHeight;f.getContext('2d').drawImage(v,0,0);const img=f.toDataURL('image/jpeg',.8);this.close();onHit(txt,img);return}}
    }catch{}this.timer=setTimeout(tick,180)};tick();
  },
  close(){clearTimeout(this.timer);this.stream?.getTracks().forEach(t=>t.stop());this.stream=null;this.el?.remove();this.el=null}
};
/* วิเคราะห์ภาพชิ้นเนื้อเบื้องต้นในเครื่อง: นับก้อน + สีเด่น (ประมาณการ ต้องตรวจสอบโดยผู้ปฏิบัติงาน) */
async function analyzeImage(src){
  const im=await loadImg(src),W=260,H=Math.max(1,Math.round(W*im.height/im.width)),c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
  const bs=[];for(let i=0;i<W;i++){bs.push([0,i],[H-1,i])}for(let j=0;j<H;j++){bs.push([j,0],[j,W-1])}
  const med=k=>{const a=bs.map(([y,xx])=>d[(y*W+xx)*4+k]).sort((p,q)=>p-q);return a[a.length>>1]};
  const bg=[med(0),med(1),med(2)],mask=new Uint8Array(W*H);
  for(let p=0;p<W*H;p++)mask[p]=(Math.abs(d[p*4]-bg[0])+Math.abs(d[p*4+1]-bg[1])+Math.abs(d[p*4+2]-bg[2]))>90?1:0;
  const seen=new Uint8Array(W*H);let blobs=0,R=0,G=0,B=0,N=0;
  for(let s=0;s<W*H;s++){if(!mask[s]||seen[s])continue;const q=[s];seen[s]=1;let a=0,r=0,g=0,b=0;
    while(q.length){const p=q.pop();a++;r+=d[p*4];g+=d[p*4+1];b+=d[p*4+2];const px=p%W,py=(p/W)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(mask[n]&&!seen[n]){seen[n]=1;q.push(n)}}}
    if(a>=W*H*.004){blobs++;R+=r;G+=g;B+=b;N+=a}}
  if(!N)return {pieces:0,color:''};
  const r=R/N/255,g=G/N/255,b=B/N/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx,s=mx?(mx-mn)/mx:0;
  let h=0;if(mx!==mn){h=mx===r?((g-b)/(mx-mn))%6:mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;h=(h*60+360)%360}
  let color=v<.2?'black':s<.15?(v>.75?'white':'gray'):(h<15||h>345)?(v<.4?'dark-brown':'pink-red'):h<45?(v<.45?'dark-brown':v<.7?'brown':'tan'):h<70?'yellow-tan':'gray';
  return {pieces:blobs,color};
}
const AI={
  async call(kind,payload){ // ต่อ Vision/LLM จริงผ่าน endpoint ของโรงพยาบาลเอง (ไม่ฝัง API key ในหน้าเว็บ)
    const u=db.settings.aiEndpoint;if(!u)return null;
    const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,...payload})});
    return (await r.json()).text||null;
  }
};
const composeGross=g=>`${g.pieces||1} ${(g.pieces||1)>1?'masses of tissue':'mass of tissue'}, ${g.shape||'irregular shape'}, with ${g.color||'dark-brown'} color${g.size?`, aggregating ${g.size}`:''}.`;

/* ============ ข้อมูลเคส ============ */
const getCase=id=>db.cases.find(c=>c.id===id);
const cur=()=>getCase(route().id);
const who=()=>db.session?.name||db.user||'—';
const docNames=()=>db.settings.doctors.map(d=>d.name);
const log=(c,text,extra={})=>{c.events.push({ts:now(),text,by:who(),...extra});save()};
const cname=c=>`${c.patient.fname||''} ${c.patient.lname||''}`.trim();
const ctLabel=ct=>`${ct.type} ${ct.n}`;
const ctFull=(c,ct)=>`${c.sNo||'(ยังไม่ลงทะเบียน)'} ${ctLabel(ct)}`;
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const setPath=(o,p,v)=>{const k=p.split('.'),l=k.pop();const t=k.reduce((a,x)=>a[x]??(a[x]={}),o);t[l]=v};
function refresh(c){ // คำนวณสถานะเคสจากบล็อก/รายงาน
  if(c.status==='draft'||c.status==='signed'||c.status==='sent')return;
  if(!c.blocks.length)c.status='registered';
  else if(c.blocks.every(b=>b.step==='qc'))c.status=(c.reading?'reading':'ready');
  else if(c.blocks.some(b=>b.step!=='grossing'))c.status='processing';
  else c.status='grossed';
}
const pendingOrders=c=>c.orders.filter(o=>o.status!=='done');

/* ============ Router ============ */
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');return {page:p[0]||'cases',id:p[1],tab:p[2]||'reception'}}
const go=h=>{location.hash=h};
function render(){
  const r=route(),V={orders:vOrders,report:vRepQ,cases:vCases,request:vReq,reception:vRecQ,login:vLogin,new:vNew,case:vCase,gross:vGrossQ,scan:vScan,worklist:vWork,his:vHis,settings:vSet}[r.page]||vCases;
  const TABNAV={request:'request',reception:'reception',gross:'gross',process:'scan',review:'worklist',order:'orders',report:'report',his:'his'};
  const cur_=r.page==='case'?TABNAV[r.tab]:r.page==='new'?'request':r.page;

});
document.addEventListener('change',e=>{const a=e.target.closest('[data-act]');if(a&&(a.tagName==='SELECT'||a.type==='checkbox'||a.type==='date'))A[a.dataset.act]?.(a)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.act&&t.tagName==='INPUT'&&t.type!=='checkbox'&&['q','wq'].includes(t.dataset.act))A[t.dataset.act](t);
  if(t.dataset.bind){const c=cur();if(!c)return;let v=t.value;if(t.dataset.num)v=+v;setPath(c,t.dataset.bind,v);save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.bind&&t.dataset.num){render()}});
window.addEventListener('hashchange',()=>Cam.close());
$('#lb').onclick=()=>$('#lb').style.display='none';
$('#user').oninput=e=>{db.user=e.target.value;save()};
document.addEventListener('submit',e=>{if(e.target.id==='lgn'){e.preventDefault();const f=e.target,d=db.settings.doctors.find(x=>x.id===f.cid.value.trim());if(!d||f.pw.value!==DEMO_PASSWORD){const m=$('#lgmsg');m.style.display='block';m.textContent='เลข 13 หลักหรือรหัสผ่านไม่ถูกต้อง';return}db.session={id:d.id,name:d.name};W.ph=d.name;save();if(location.hash==='#/worklist')render();else go('#/worklist');return}
  if(e.target.id!=='frm')return;e.preventDefault();
  const f=e.target,v=n=>f[n].value.trim(),sites=$$('[name=site]',f).map(x=>x.value.trim()).filter(Boolean);
  let bags=+v('bags')||0,bot=+v('bottles')||0;if(bags<0||bot<0||(!bags&&!bot))return alert('ต้องระบุจำนวนภาชนะ (ถุง หรือ ขวด) อย่างน้อยหนึ่งอย่าง');
  const fillIsDoc=f.fillerIsDoc.checked;if(!fillIsDoc&&!v('filler'))return alert('กรุณาระบุชื่อผู้กรอกใบคำขอ');
  const containers=[];for(let i=1;i<=bot;i++)containers.push({type:'ขวด',n:i,site:sites[i-1]||'',photos:[],gPhotos:[],g:{},gross:''});for(let i=1;i<=bags;i++)containers.push({type:'ถุง',n:i,site:sites[bot+i-1]||'',photos:[],gPhotos:[],g:{},gross:''});
  const type=v('type')==='อื่นๆ'&&v('typeOther')?v('typeOther'):v('type'),proc=f.proc.value==='Other'&&v('procOther')?v('procOther'):f.proc.value;
  const c={id:uid(),createdAt:now(),status:'draft',source:f.source.value,pathologist:'',
    patient:{hn:v('hn'),fname:v('fname'),lname:v('lname'),dob:f.dob.value,age:v('age'),sex:f.sex.value,hospital:v('hospital'),ward:v('ward'),doctor:v('doctor')},
    req:{type,proc,sites,hiv:f.hiv.value,filler:{isDoctor:fillIsDoc,name:fillIsDoc?v('doctor'):v('filler')},history:v('history'),exam:v('exam'),radiology:v('radiology'),prevPatho:v('prevPatho'),provisional:v('provisional')},
    containers,blocks:[],orders:[],events:[],consults:[],report:{}};
  db.cases.push(c);log(c,'รับใบคำขอ ('+(c.source==='HIS'?'HIS':'กรอกเอง')+')');go('#/request')});
window.addEventListener('hashchange',render);

(async()=>{let d;try{d=await idb.get('db')}catch(e){console.warn('IndexedDB ใช้ไม่ได้ — ข้อมูลอยู่ในหน่วยความจำชั่วคราว')}if(d){db=d;db.settings={...{hisPullUrl:'',hisResultUrl:'',aiEndpoint:'',doctors:DOCTORS},...db.settings};db.settings.doctors=DOCTORS}$('#user').value=db.user||'';render()})();
</script>
